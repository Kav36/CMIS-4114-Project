<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Chat with PDFs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 800px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .chat-box {
      width: 100%;
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      background-color: #f9f9f9;
      margin-bottom: 20px;
    }
    .chat-message {
      display: flex;
      margin-bottom: 10px;
      max-width: 80%;
      padding: 10px;
      border-radius: 10px;
      line-height: 1.5;
    }
    .user-message {
      background-color: #e1f7d5;
      align-self: flex-end;
      margin-left: auto;
    }
    .bot-message {
      background-color: #e0e0e0;
      align-self: flex-start;
      margin-right: auto;
    }
    input[type="file"], button {
      padding: 10px;
      font-size: 16px;
      margin: 5px 0;
      width: 100%;
      max-width: 400px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
  <script>
    let combinedContext = "";  // To accumulate extracted text from PDFs

    async function uploadPDF() {
      const fileInput = document.getElementById("pdfFile");
      const files = fileInput.files;

      if (files.length === 0) {
        return;
      }

      // Loop through each uploaded file and send to the backend for extraction
      for (let i = 0; i < files.length; i++) {
        const formData = new FormData();
        formData.append("file", files[i]);

        const response = await fetch("/upload", {
          method: "POST",
          body: formData,
        });

        const data = await response.json();

        // Add the extracted text from each PDF to the combined context
        if (data.context) {
          combinedContext += "\n" + data.context;
          console.log(`Extracted text from PDF: "${files[i].name}"`);
          console.log(data.context);  // Log the extracted text to the console
        }

        // Display the file name in the chat
        addMessage('bot', `Text from PDF: "${files[i].name}" has been extracted.`);
      }
    }

    async function askQuestion() {
      if (combinedContext === "") {
        addMessage('bot', "No context available. Please upload PDFs first.");
        return;
      }

      const question = document.getElementById("question").value;
      addMessage('user', question);  // Add user question to the chat

      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ context: combinedContext, question }),
      });

      const data = await response.json();
      addMessage('bot', `Answer: ${data.answer}\nScore: ${data.score}`);
    }

    // Function to add messages to the chat
    function addMessage(sender, message) {
      const chatBox = document.getElementById("chatBox");
      const messageDiv = document.createElement("div");
      messageDiv.classList.add("chat-message");
      messageDiv.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
      messageDiv.textContent = message;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;  // Scroll to the latest message
    }
  </script>
</head>
<body>
  <h1>QA Chat with PDFs</h1>
  <div class="chat-container">
    <div id="chatBox" class="chat-box">
      <!-- Chat messages will appear here -->
    </div>

    <form onsubmit="event.preventDefault(); uploadPDF();">
      <input type="file" id="pdfFile" name="file" accept="application/pdf" multiple required />
      <button type="submit">Upload PDFs</button>
    </form>

    <input type="text" id="question" placeholder="Ask a question" />
    <button onclick="askQuestion()">Ask</button>
  </div>
</body>
</html>
