<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUESTED</title>
  <link rel="icon" href="logo-placeholder.png" type="image/png">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f4f4f4;
    }
    .logo {
      width: 450px;
      margin-bottom: 20px;
    }
    .chat-container {
      position: relative;
    }
    .chat-box {
      height: 400px;
      overflow-y: auto;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .chat-message {
      display: flex;
      margin-bottom: 10px;
      max-width: 80%;
      padding: 10px;
      border-radius: 10px;
      line-height: 1.5;
    }
    .user-message {
      background-color: #e1f7d5;
      align-self: flex-end;
      margin-left: auto;
    }
    .bot-message {
      background-color: #e0e0e0;
      align-self: flex-start;
      margin-right: auto;
    }
    .clear-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="text-center">
      <img src="logo.png" alt="Logo" class="logo">
      <h3>QA Chat with PDFs</h3>
    </div>

    <div class="chat-container bg-white p-4 rounded shadow position-relative">
      <div id="chatBox" class="chat-box">
        <!-- Chat messages will appear here -->
      </div>

      <form class="mb-3 d-flex align-items-center gap-2" onsubmit="event.preventDefault(); uploadPDF();">
        <div class="col-md-10">
          <input type="file" id="pdfFile" name="file" class="form-control" accept="application/pdf" multiple required />
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-success w-100">Upload PDFs</button>
        </div>
      </form>

      <div class="input-group mb-3">
        <input type="text" id="question" class="form-control" placeholder="Ask a question">
        <button class="btn btn-primary" onclick="askQuestion()">Ask</button>
      </div>
    </div>

    <button class="btn btn-danger clear-button" onclick="clearChat()">Clear All</button>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let combinedContext = "";  // To accumulate extracted text from PDFs

    async function uploadPDF() {
      const fileInput = document.getElementById("pdfFile");
      const files = fileInput.files;

      if (files.length === 0) {
        return;
      }

      // Loop through each uploaded file and send to the backend for extraction
      for (let i = 0; i < files.length; i++) {
        const formData = new FormData();
        formData.append("file", files[i]);

        const response = await fetch("/upload", {
          method: "POST",
          body: formData,
        });

        const data = await response.json();

        // Add the extracted text from each PDF to the combined context
        if (data.context) {
          combinedContext += "\n" + data.context;
          console.log(`Extracted text from PDF: "${files[i].name}"`);
          console.log(data.context);  // Log the extracted text to the console
        }

        // Display the file name in the chat
        addMessage('bot', `Text from PDF: "${files[i].name}" has been extracted.`);
      }
    }

    async function askQuestion() {
      if (combinedContext === "") {
        addMessage('bot', "No context available. Please upload PDFs first.");
        return;
      }

      const question = document.getElementById("question").value;
      addMessage('user', question);  // Add user question to the chat

      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ context: combinedContext, question }),
      });

      const data = await response.json();
      addMessage('bot', `${data.answer}`);
      // addMessage('bot', `Answer: ${data.answer}\nScore: ${data.score}`);
    }

    // Function to add messages to the chat
    function addMessage(sender, message) {
      const chatBox = document.getElementById("chatBox");
      const messageDiv = document.createElement("div");
      messageDiv.classList.add("chat-message");
      messageDiv.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
      messageDiv.textContent = message;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;  // Scroll to the latest message
    }

    // Function to clear all messages in the chat
    function clearChat() {
      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = ""; // Clear all chat messages
    }
  </script>
</body>
</html>
